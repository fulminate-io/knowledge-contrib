[package]
name = "knowledge-collector-framework"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "The MCP serving and contract layer a custom knowledge collector is built on, in Rust."
repository = "https://github.com/fulminate-io/knowledge-contrib"
publish = false

[dependencies]
rmcp = { version = "3.2.0", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
jsonschema = { version = "0.55", default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
jsonschema = { version = "0.55", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
